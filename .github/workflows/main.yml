name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # .NET 11 is still prerelease (11.0.100-rc.3 here). setup-dotnet's A.B.x syntax already includes prerelease versions, so no include-prerelease input is needed (that input was removed in setup-dotnet v4+ and only produced a warning).
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Publish Blazor project
        run: dotnet publish src/Rise.Wasm/Rise.Wasm.csproj -c Release -o release --nologo

      # changes the base-tag in index.html from '/' to '/Rise/' to match GitHub Pages repository subdirectory
      - name: Change base-tag in index.html from / to /Rise/
        run: sed -i 's|<base href="/" />|<base href="/Rise/" />|g' release/wwwroot/index.html

      # copy index.html to 404.html to serve the same file when a file is not found
      - name: copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # add .nojekyll file to tell GitHub pages to not treat this as a Jekyll project. (Allow files and folders starting with an underscore)
      - name: Add .nojekyll file
        run: touch release/wwwroot/.nojekyll

      - name: Commit wwwroot to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: release/wwwroot
