<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Rise</title>

    <base href="/Rise/" />

    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

    <link href="Rise.Wasm.styles.css" rel="stylesheet" />

    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="Rise-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="Rise-192.png" />
    <script>
        // Apply an explicit stored theme before first paint, so dark
        // users don't flash light. "system" (or nothing stored) leaves
        // data-theme unset, and the CSS system media query decides. A
        // "custom:<id>" choice applies that theme's light or dark half
        // as inline variables, by device preference. A
        // "pack:omarchy:<slug>" choice applies that pack theme's single
        // palette as inline variables; the palettes are cached in
        // localStorage by the app (rise.omarchy-themes.v1), because
        // this script runs before Blazor starts. Keep the variable
        // names in sync with app.css and the riseTheme block below.
        (function () {
            try {
                var t = window.localStorage.getItem('rise.theme.v1');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                } else if (t && t.indexOf('custom:') === 0) {
                    var themes = JSON.parse(window.localStorage.getItem('rise.themes.v1') || '[]');
                    var id = t.substring('custom:'.length);
                    var found = null;
                    for (var i = 0; i < themes.length; i++) {
                        if (themes[i].Id === id) { found = themes[i]; break; }
                    }
                    if (found) {
                        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        var half = dark ? found.Dark : found.Light;
                        var vars = {
                            '--calm-bg': half.Background, '--calm-text': half.Text,
                            '--calm-muted': half.Muted, '--calm-faint': half.Faint,
                            '--calm-surface': half.Surface, '--calm-border': half.Border,
                            '--calm-border-soft': half.BorderSoft, '--calm-tile-bg': half.TileBackground,
                            '--calm-error': half.Error
                        };
                        for (var key in vars) {
                            if (vars[key]) { document.documentElement.style.setProperty(key, vars[key]); }
                        }
                    }
                } else if (t && t.indexOf('pack:omarchy:') === 0) {
                    var packs = JSON.parse(window.localStorage.getItem('rise.omarchy-themes.v1') || '[]');
                    var slug = t.substring('pack:omarchy:'.length);
                    var foundPack = null;
                    for (var j = 0; j < packs.length; j++) {
                        if (packs[j].Id === slug) { foundPack = packs[j]; break; }
                    }
                    if (foundPack && foundPack.Palette) {
                        var packVars = {
                            '--calm-bg': foundPack.Palette.Background, '--calm-text': foundPack.Palette.Text,
                            '--calm-muted': foundPack.Palette.Muted, '--calm-faint': foundPack.Palette.Faint,
                            '--calm-surface': foundPack.Palette.Surface, '--calm-border': foundPack.Palette.Border,
                            '--calm-border-soft': foundPack.Palette.BorderSoft, '--calm-tile-bg': foundPack.Palette.TileBackground,
                            '--calm-error': foundPack.Palette.Error
                        };
                        for (var packKey in packVars) {
                            if (packVars[packKey]) { document.documentElement.style.setProperty(packKey, packVars[packKey]); }
                        }
                    }
                }
            } catch (e) { /* private mode or corrupt data: stay on the CSS default */ }
        })();
        // Home screen icon: the install-time manifest follows the theme.
        // Chrome re-reads only the static manifest for an installed app,
        // so this can only pick the icon the user installs with —
        // changing the theme later never changes an installed icon.
        // While the "follow" preference is on (the default), this swaps
        // the manifest <link> for a blob manifest built from the active
        // theme: icons/<slug>-512.png / -192.png for an Omarchy pack
        // theme, or the calm light/dark icon for a built-in, system, or
        // custom choice (custom palettes have no prebuilt file, so they
        // get the calm icon of their active half's mode). Icon URLs
        // inside a blob manifest resolve against the blob URL, so they
        // are absolute, built from the static manifest's own URL — that
        // keeps the /Rise/ subpath working on GitHub Pages. The
        // apple-touch-icon links are swapped the same way, so iOS "Add
        // to Home Screen" matches too. Turning the preference off
        // restores the static manifest and icons. When the pack palette
        // cache is missing (first boot before the app writes it), the
        // static manifest stays until the next load or theme change.
        window.riseHomeIcon = (function () {
            var prefKey = 'rise.home-icon.v1';
            var themeKey = 'rise.theme.v1';
            var packKey = 'rise.omarchy-themes.v1';
            var customKey = 'rise.themes.v1';
            var staticHref = null;
            var staticUrl = null;
            var currentBlobUrl = null;

            function prefersDark() {
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            function stored(key) {
                try { return window.localStorage.getItem(key); } catch (e) { return null; }
            }
            function parsed(key) {
                try { return JSON.parse(stored(key) || '[]'); } catch (e) { return []; }
            }
            function findById(list, id) {
                for (var i = 0; i < list.length; i++) {
                    if (list[i].Id === id) { return list[i]; }
                }
                return null;
            }
            // The active theme as { background, iconBase }, or null when
            // it cannot be resolved (missing pack cache, deleted custom).
            function resolve() {
                var choice = stored(themeKey);
                var dark = prefersDark();
                if (choice === 'light') { return { background: '#f7f5f0', iconBase: 'icons/calm-light' }; }
                if (choice === 'dark') { return { background: '#1b1b1f', iconBase: 'icons/calm-dark' }; }
                if (choice && choice.indexOf('custom:') === 0) {
                    var found = findById(parsed(customKey), choice.substring('custom:'.length));
                    if (!found) { return null; }
                    var half = dark ? found.Dark : found.Light;
                    if (!half || !half.Background) { return null; }
                    return { background: half.Background, iconBase: dark ? 'icons/calm-dark' : 'icons/calm-light' };
                }
                if (choice && choice.indexOf('pack:omarchy:') === 0) {
                    var pack = findById(parsed(packKey), choice.substring('pack:omarchy:'.length));
                    if (!pack || !pack.Palette || !pack.Palette.Background) { return null; }
                    return { background: pack.Palette.Background, iconBase: 'icons/' + pack.Id };
                }
                // "system" or nothing stored: the device decides.
                return dark
                    ? { background: '#1b1b1f', iconBase: 'icons/calm-dark' }
                    : { background: '#f7f5f0', iconBase: 'icons/calm-light' };
            }
            function setAppleIcons(iconBase) {
                var links = document.querySelectorAll('link[rel="apple-touch-icon"]');
                for (var i = 0; i < links.length; i++) {
                    var sizes = links[i].getAttribute('sizes');
                    links[i].setAttribute('href', sizes === '192x192'
                        ? iconBase + '-192.png'
                        : iconBase + '-512.png');
                }
            }
            function restoreStatic(link) {
                if (staticHref) { link.setAttribute('href', staticHref); }
                setAppleIcons('Rise');
            }
            return {
                apply: function () {
                    try {
                        var link = document.querySelector('link[rel="manifest"]');
                        if (!link) { return false; }
                        if (!staticHref) {
                            staticHref = link.getAttribute('href') || 'manifest.json';
                            staticUrl = new URL(staticHref, document.baseURI).href;
                        }
                        if (stored(prefKey) === 'static') { restoreStatic(link); return true; }
                        var theme = resolve();
                        if (!theme) { restoreStatic(link); return false; }
                        var root = new URL('.', staticUrl).href;
                        var manifest = {
                            name: 'Rise',
                            short_name: 'Rise',
                            id: root,
                            start_url: root,
                            display: 'standalone',
                            background_color: theme.background,
                            theme_color: theme.background,
                            icons: [
                                { src: new URL(theme.iconBase + '-512.png', staticUrl).href, sizes: '512x512', type: 'image/png', purpose: 'any' },
                                { src: new URL(theme.iconBase + '-192.png', staticUrl).href, sizes: '192x192', type: 'image/png', purpose: 'any' }
                            ]
                        };
                        if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); }
                        currentBlobUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
                        link.setAttribute('href', currentBlobUrl);
                        setAppleIcons(theme.iconBase);
                        return true;
                    } catch (e) { /* stay on whatever manifest is live */ return false; }
                },
                // The 512 icon the page currently points at, for the Settings preview.
                iconHref: function () {
                    var el = document.querySelector('link[rel="apple-touch-icon"][sizes="512x512"]');
                    return el ? el.getAttribute('href') : null;
                }
            };
        })();
        try { window.riseHomeIcon.apply(); } catch (e) { /* stay on the static manifest */ }
    </script>
</head>

<body>
    <div id="app">
        <div class="calm-loading" role="status" aria-label="Loading Rise">
            <div class="calm-loading-word">Rise</div>
            <div class="calm-loading-bar"><div class="calm-loading-bar-fill"></div></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        window.riseStorage = {
            get: function (key) { return window.localStorage.getItem(key); },
            set: function (key, value) { window.localStorage.setItem(key, value); }
        };
        // Theme helpers for the Settings slice. Kept in the shell
        // (not in a component) so slices stay free of JS interop.
        // Custom palettes live as inline variables, which override the
        // stylesheet palettes; switching to a built-in theme clears
        // them again. Variable names stay in sync with app.css.
        window.riseTheme = {
            customVars: ['--calm-bg', '--calm-text', '--calm-muted', '--calm-faint',
                '--calm-surface', '--calm-border', '--calm-border-soft', '--calm-tile-bg', '--calm-error'],
            getStored: function (key) { return window.localStorage.getItem(key); },
            setStored: function (key, value) { window.localStorage.setItem(key, value); },
            clearCustom: function () {
                var vars = window.riseTheme.customVars;
                for (var i = 0; i < vars.length; i++) {
                    document.documentElement.style.removeProperty(vars[i]);
                }
            },
            apply: function (theme) {
                window.riseTheme.clearCustom();
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            },
            applyCustom: function (vars) {
                document.documentElement.removeAttribute('data-theme');
                for (var key in vars) {
                    if (vars[key]) { document.documentElement.style.setProperty(key, vars[key]); }
                }
            },
            applyStoredCustom: function () {
                try {
                    var t = window.localStorage.getItem('rise.theme.v1');
                    if (!t || t.indexOf('custom:') !== 0) { return; }
                    var themes = JSON.parse(window.localStorage.getItem('rise.themes.v1') || '[]');
                    var id = t.substring('custom:'.length);
                    var found = null;
                    for (var i = 0; i < themes.length; i++) {
                        if (themes[i].Id === id) { found = themes[i]; break; }
                    }
                    if (!found) { return; }
                    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var half = dark ? found.Dark : found.Light;
                    var vars = {
                        '--calm-bg': half.Background, '--calm-text': half.Text,
                        '--calm-muted': half.Muted, '--calm-faint': half.Faint,
                        '--calm-surface': half.Surface, '--calm-border': half.Border,
                        '--calm-border-soft': half.BorderSoft, '--calm-tile-bg': half.TileBackground,
                        '--calm-error': half.Error
                    };
                    window.riseTheme.applyCustom(vars);
                } catch (e) { /* corrupt data: leave the current theme alone */ }
            },
            prefersDark: function () {
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
        };
        // Global hotkey listener for the shell. Forwards keystrokes to
        // .NET, except keystrokes typed into editable fields (inputs,
        // textareas, selects, content-editable) — those belong to the
        // field — and except modifier shortcuts and Escape, which
        // always forward so the palette opens even while typing and
        // closes from anywhere. Repeats are ignored so holding a key
        // never fires its action twice.
        window.riseHotkeys = {
            ref: null,
            handler: function (e) {
                if (e.repeat) { return; }
                var target = e.target;
                var editable = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable);
                var mod = e.ctrlKey || e.metaKey;
                if (editable && !mod && e.key !== 'Escape') { return; }
                if (!window.riseHotkeys.ref) { return; }
                window.riseHotkeys.ref.invokeMethodAsync('OnHotkeyKeyDown', e.key, mod, e.altKey, e.shiftKey);
            },
            register: function (dotNetRef) {
                window.riseHotkeys.ref = dotNetRef;
                document.addEventListener('keydown', window.riseHotkeys.handler);
            },
            unregister: function () {
                document.removeEventListener('keydown', window.riseHotkeys.handler);
                window.riseHotkeys.ref = null;
            }
        };
        // Fullscreen toggle for the 2048 widget. requestFullscreen
        // on the widget root puts scores + board fullscreen
        // together; the fullscreenchange listener reports back into
        // .NET so the button label stays right when the user exits
        // with Escape or the browser chrome. iOS Safari has no
        // requestFullscreen on arbitrary elements, so supported()
        // is false there and the button stays hidden. Entering
        // focuses the board so arrow keys keep working without
        // another click.
        window.riseFullscreen = {
            ref: null,
            handler: function () {
                if (!window.riseFullscreen.ref) { return; }
                window.riseFullscreen.ref.invokeMethodAsync('OnFullscreenChanged', !!document.fullscreenElement);
            },
            supported: function () {
                return !!document.documentElement.requestFullscreen;
            },
            toggle: function (element) {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                    return;
                }
                if (!element || !element.requestFullscreen) { return; }
                var entered = element.requestFullscreen();
                if (entered && entered.then) {
                    entered.then(function () {
                        var board = element.querySelector('.calm-game2048-board');
                        if (board) { board.focus(); }
                    }).catch(function () { /* not allowed: stay as-is */ });
                }
            },
            register: function (dotNetRef) {
                window.riseFullscreen.ref = dotNetRef;
                document.addEventListener('fullscreenchange', window.riseFullscreen.handler);
            },
            unregister: function () {
                document.removeEventListener('fullscreenchange', window.riseFullscreen.handler);
                window.riseFullscreen.ref = null;
            }
        };
        // Download helper for the Backup slice. Kept in the shell
        // (not in a component) so slices stay free of JS interop.
        window.riseDownload = {
            save: function (filename, content) {
                var blob = new Blob([content], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }
        };
        // Uploaded background images live in IndexedDB, keyed by the
        // SHA-256 hash of the file — localStorage is too small and
        // string-only for image bytes. load() turns the stored blob
        // back into a blob URL the page references like any image;
        // it returns null when the bytes are gone (fresh device after
        // a backup restore, or the browser evicted the store), and
        // the app prompts for a re-upload from the stored descriptor.
        // Only one background URL is live at a time: loading a new
        // one revokes the old, and clearUrl() drops it when the
        // choice moves away from an upload.
        window.riseBackgroundImage = (function () {
            var currentUrl = null;
            function openDb() {
                return new Promise(function (resolve, reject) {
                    var req = indexedDB.open('rise', 1);
                    req.onupgradeneeded = function () { req.result.createObjectStore('background-images'); };
                    req.onsuccess = function () { resolve(req.result); };
                    req.onerror = function () { reject(req.error); };
                });
            }
            function run(db, mode, op) {
                return new Promise(function (resolve, reject) {
                    var req = op(db.transaction('background-images', mode).objectStore('background-images'));
                    req.onsuccess = function () { resolve(req.result); };
                    req.onerror = function () { reject(req.error); };
                });
            }
            return {
                save: async function (hash, bytes, mimeType) {
                    var db = await openDb();
                    try {
                        await run(db, 'readwrite', function (store) { return store.put(new Blob([bytes], { type: mimeType }), hash); });
                    } finally { db.close(); }
                },
                load: async function (hash) {
                    var db = await openDb();
                    var blob;
                    try {
                        blob = await run(db, 'readonly', function (store) { return store.get(hash); });
                    } finally { db.close(); }
                    if (!blob) { return null; }
                    if (currentUrl) { URL.revokeObjectURL(currentUrl); }
                    currentUrl = URL.createObjectURL(blob);
                    return currentUrl;
                },
                remove: async function (hash) {
                    var db = await openDb();
                    try {
                        await run(db, 'readwrite', function (store) { return store.delete(hash); });
                    } finally { db.close(); }
                },
                clearUrl: function () {
                    if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
                }
            };
        })();
        // When the device flips light/dark, a custom theme follows it
        // by re-applying the matching half, and the install-time
        // manifest follows it too when the home icon follows the theme.
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            window.riseTheme.applyStoredCustom();
            window.riseHomeIcon.apply();
        });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
