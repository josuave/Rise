<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Rise</title>

    <base href="/Rise/" />

    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

    <link href="Rise.Wasm.styles.css" rel="stylesheet" />

    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="Rise-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="Rise-192.png" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        window.riseStorage = {
            get: function (key) { return window.localStorage.getItem(key); },
            set: function (key, value) { window.localStorage.setItem(key, value); }
        };
        // Diagnostics/maintenance helpers for the Settings slice. Kept in the
        // shell (not in a component) so slices stay free of JS interop.
        window.riseDiagnostics = {
            getRaw: function (key) { return window.localStorage.getItem(key); },
            clearKey: function (key) { window.localStorage.removeItem(key); return window.localStorage.getItem(key) === null; },
            getUserAgent: function () { return window.navigator.userAgent; },
            copyText: async function (text) { try { await window.navigator.clipboard.writeText(text); return true; } catch { return false; } },
            getServiceWorkers: async function () {
                if (!('serviceWorker' in window.navigator)) return 'not supported';
                var regs = await window.navigator.serviceWorker.getRegistrations();
                if (regs.length === 0) return 'none registered';
                return regs.length + ' registered: ' + regs.map(function (r) { return r.scope; }).join(', ');
            },
            unregisterServiceWorkers: async function () {
                if (!('serviceWorker' in window.navigator)) return false;
                var regs = await window.navigator.serviceWorker.getRegistrations();
                var ok = true;
                for (var i = 0; i < regs.length; i++) { ok = await regs[i].unregister() && ok; }
                return ok;
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
