<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Rise</title>

    <base href="/" />

    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

    <link href="Rise.Wasm.styles.css" rel="stylesheet" />

    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="Rise-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="Rise-192.png" />
    <script>
        // Apply an explicit stored theme before first paint, so dark
        // users don't flash light. "system" (or nothing stored) leaves
        // data-theme unset, and the CSS system media query decides. A
        // "custom:<id>" choice applies that theme's light or dark half
        // as inline variables, by device preference. A
        // "pack:omarchy:<slug>" choice applies that pack theme's single
        // palette as inline variables; the palettes are cached in
        // localStorage by the app (rise.omarchy-themes.v1), because
        // this script runs before Blazor starts. Keep the variable
        // names in sync with app.css and the riseTheme block below.
        (function () {
            try {
                var t = window.localStorage.getItem('rise.theme.v1');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                } else if (t && t.indexOf('custom:') === 0) {
                    var themes = JSON.parse(window.localStorage.getItem('rise.themes.v1') || '[]');
                    var id = t.substring('custom:'.length);
                    var found = null;
                    for (var i = 0; i < themes.length; i++) {
                        if (themes[i].Id === id) { found = themes[i]; break; }
                    }
                    if (found) {
                        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        var half = dark ? found.Dark : found.Light;
                        var vars = {
                            '--calm-bg': half.Background, '--calm-text': half.Text,
                            '--calm-muted': half.Muted, '--calm-faint': half.Faint,
                            '--calm-surface': half.Surface, '--calm-border': half.Border,
                            '--calm-border-soft': half.BorderSoft, '--calm-tile-bg': half.TileBackground,
                            '--calm-error': half.Error
                        };
                        for (var key in vars) {
                            if (vars[key]) { document.documentElement.style.setProperty(key, vars[key]); }
                        }
                    }
                } else if (t && t.indexOf('pack:omarchy:') === 0) {
                    var packs = JSON.parse(window.localStorage.getItem('rise.omarchy-themes.v1') || '[]');
                    var slug = t.substring('pack:omarchy:'.length);
                    var foundPack = null;
                    for (var j = 0; j < packs.length; j++) {
                        if (packs[j].Id === slug) { foundPack = packs[j]; break; }
                    }
                    if (foundPack && foundPack.Palette) {
                        var packVars = {
                            '--calm-bg': foundPack.Palette.Background, '--calm-text': foundPack.Palette.Text,
                            '--calm-muted': foundPack.Palette.Muted, '--calm-faint': foundPack.Palette.Faint,
                            '--calm-surface': foundPack.Palette.Surface, '--calm-border': foundPack.Palette.Border,
                            '--calm-border-soft': foundPack.Palette.BorderSoft, '--calm-tile-bg': foundPack.Palette.TileBackground,
                            '--calm-error': foundPack.Palette.Error
                        };
                        for (var packKey in packVars) {
                            if (packVars[packKey]) { document.documentElement.style.setProperty(packKey, packVars[packKey]); }
                        }
                    }
                }
            } catch (e) { /* private mode or corrupt data: stay on the CSS default */ }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="calm-loading" role="status" aria-label="Loading Rise">
            <div class="calm-loading-word">Rise</div>
            <div class="calm-loading-bar"><div class="calm-loading-bar-fill"></div></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        window.riseStorage = {
            get: function (key) { return window.localStorage.getItem(key); },
            set: function (key, value) { window.localStorage.setItem(key, value); }
        };
        // Theme helpers for the Settings slice. Kept in the shell
        // (not in a component) so slices stay free of JS interop.
        // Custom palettes live as inline variables, which override the
        // stylesheet palettes; switching to a built-in theme clears
        // them again. Variable names stay in sync with app.css.
        window.riseTheme = {
            customVars: ['--calm-bg', '--calm-text', '--calm-muted', '--calm-faint',
                '--calm-surface', '--calm-border', '--calm-border-soft', '--calm-tile-bg', '--calm-error'],
            getStored: function (key) { return window.localStorage.getItem(key); },
            setStored: function (key, value) { window.localStorage.setItem(key, value); },
            clearCustom: function () {
                var vars = window.riseTheme.customVars;
                for (var i = 0; i < vars.length; i++) {
                    document.documentElement.style.removeProperty(vars[i]);
                }
            },
            apply: function (theme) {
                window.riseTheme.clearCustom();
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            },
            applyCustom: function (vars) {
                document.documentElement.removeAttribute('data-theme');
                for (var key in vars) {
                    if (vars[key]) { document.documentElement.style.setProperty(key, vars[key]); }
                }
            },
            applyStoredCustom: function () {
                try {
                    var t = window.localStorage.getItem('rise.theme.v1');
                    if (!t || t.indexOf('custom:') !== 0) { return; }
                    var themes = JSON.parse(window.localStorage.getItem('rise.themes.v1') || '[]');
                    var id = t.substring('custom:'.length);
                    var found = null;
                    for (var i = 0; i < themes.length; i++) {
                        if (themes[i].Id === id) { found = themes[i]; break; }
                    }
                    if (!found) { return; }
                    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var half = dark ? found.Dark : found.Light;
                    var vars = {
                        '--calm-bg': half.Background, '--calm-text': half.Text,
                        '--calm-muted': half.Muted, '--calm-faint': half.Faint,
                        '--calm-surface': half.Surface, '--calm-border': half.Border,
                        '--calm-border-soft': half.BorderSoft, '--calm-tile-bg': half.TileBackground,
                        '--calm-error': half.Error
                    };
                    window.riseTheme.applyCustom(vars);
                } catch (e) { /* corrupt data: leave the current theme alone */ }
            },
            prefersDark: function () {
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
        };
        // Global hotkey listener for the shell. Forwards keystrokes to
        // .NET, except keystrokes typed into editable fields (inputs,
        // textareas, selects, content-editable) — those belong to the
        // field — and except modifier shortcuts and Escape, which
        // always forward so the palette opens even while typing and
        // closes from anywhere. Repeats are ignored so holding a key
        // never fires its action twice.
        window.riseHotkeys = {
            ref: null,
            handler: function (e) {
                if (e.repeat) { return; }
                var target = e.target;
                var editable = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable);
                var mod = e.ctrlKey || e.metaKey;
                if (editable && !mod && e.key !== 'Escape') { return; }
                if (!window.riseHotkeys.ref) { return; }
                window.riseHotkeys.ref.invokeMethodAsync('OnHotkeyKeyDown', e.key, mod, e.altKey, e.shiftKey);
            },
            register: function (dotNetRef) {
                window.riseHotkeys.ref = dotNetRef;
                document.addEventListener('keydown', window.riseHotkeys.handler);
            },
            unregister: function () {
                document.removeEventListener('keydown', window.riseHotkeys.handler);
                window.riseHotkeys.ref = null;
            }
        };
        // Download helper for the Backup slice. Kept in the shell
        // (not in a component) so slices stay free of JS interop.
        window.riseDownload = {
            save: function (filename, content) {
                var blob = new Blob([content], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }
        };
        // Uploaded background images live in IndexedDB, keyed by the
        // SHA-256 hash of the file — localStorage is too small and
        // string-only for image bytes. load() turns the stored blob
        // back into a blob URL the page references like any image;
        // it returns null when the bytes are gone (fresh device after
        // a backup restore, or the browser evicted the store), and
        // the app prompts for a re-upload from the stored descriptor.
        // Only one background URL is live at a time: loading a new
        // one revokes the old, and clearUrl() drops it when the
        // choice moves away from an upload.
        window.riseBackgroundImage = (function () {
            var currentUrl = null;
            function openDb() {
                return new Promise(function (resolve, reject) {
                    var req = indexedDB.open('rise', 1);
                    req.onupgradeneeded = function () { req.result.createObjectStore('background-images'); };
                    req.onsuccess = function () { resolve(req.result); };
                    req.onerror = function () { reject(req.error); };
                });
            }
            function run(db, mode, op) {
                return new Promise(function (resolve, reject) {
                    var req = op(db.transaction('background-images', mode).objectStore('background-images'));
                    req.onsuccess = function () { resolve(req.result); };
                    req.onerror = function () { reject(req.error); };
                });
            }
            return {
                save: async function (hash, bytes, mimeType) {
                    var db = await openDb();
                    try {
                        await run(db, 'readwrite', function (store) { return store.put(new Blob([bytes], { type: mimeType }), hash); });
                    } finally { db.close(); }
                },
                load: async function (hash) {
                    var db = await openDb();
                    var blob;
                    try {
                        blob = await run(db, 'readonly', function (store) { return store.get(hash); });
                    } finally { db.close(); }
                    if (!blob) { return null; }
                    if (currentUrl) { URL.revokeObjectURL(currentUrl); }
                    currentUrl = URL.createObjectURL(blob);
                    return currentUrl;
                },
                remove: async function (hash) {
                    var db = await openDb();
                    try {
                        await run(db, 'readwrite', function (store) { return store.delete(hash); });
                    } finally { db.close(); }
                },
                clearUrl: function () {
                    if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
                }
            };
        })();
        // When the device flips light/dark, a custom theme follows it
        // by re-applying the matching half.
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            window.riseTheme.applyStoredCustom();
        });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
